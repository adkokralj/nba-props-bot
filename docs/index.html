<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Props Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --floor:#0f1b24;      /* arena floor */
  --floor2:#16262f;
  --line:#25394a;
  --paper:#f3f5f1;      /* ticket stock */
  --paper2:#e4e8e1;
  --ink:#0e1a22;
  --ink2:#51606b;
  --txt:#e9eef1;
  --mute:#8fa3b0;
  --ball:#ff7a3d;       /* basketball orange */
  --good:#27c28a;
  --bad:#ff6b5e;
  --amber:#f2b84b;
  --disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--floor);color:var(--txt);font:16px/1.5 var(--body);-webkit-text-size-adjust:100%}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 56px}
a,button,select,input{font:inherit}
:focus-visible{outline:2px solid var(--ball);outline-offset:2px}

/* masthead */
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand{font:700 30px/1 var(--disp);letter-spacing:.01em;margin:0}
.when{color:var(--mute);font-size:14px}
.tabs{display:flex;gap:4px;margin:18px 0 22px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;color:var(--mute);padding:10px 14px;font:600 17px/1 var(--disp);letter-spacing:.02em;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--txt);border-bottom-color:var(--ball)}

/* hero: how many slips land */
.hero{display:grid;gap:18px;margin-bottom:26px}
.hero-num{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.hero-num b{font:700 76px/.9 var(--disp);color:var(--ball)}
.hero-num span{font:500 22px/1.2 var(--disp);color:var(--txt)}
.scale{position:relative;height:96px;margin:0 6px}
.scale .rail{position:absolute;left:0;right:0;top:62px;height:6px;border-radius:3px;background:linear-gradient(90deg,hsl(20 95% 58%),hsl(85 70% 50%),hsl(150 60% 48%))}
.scale .tick{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;font:700 14px/1 var(--disp);color:var(--txt)}
.scale .tick i{width:2px;background:var(--txt);border-radius:1px;display:block;flex:1}
.scale .ends{position:absolute;left:0;right:0;top:76px;display:flex;justify-content:space-between;color:var(--mute);font-size:12px}
.fine{color:var(--mute);font-size:13px;max-width:62ch;margin:0}

.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 14px}
.bar .lbl{color:var(--mute);font-size:14px;margin-right:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;color:var(--mute);padding:7px 14px;cursor:pointer;font-size:14px}
.seg button[aria-pressed=true]{background:var(--floor2);color:var(--txt)}

/* tickets */
.tickets{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:820px){.tickets{grid-template-columns:1fr 1fr}}
.ticket{display:grid;grid-template-columns:1fr 112px;background:var(--paper);color:var(--ink);border-radius:14px;position:relative;overflow:hidden}
.ticket:before,.ticket:after{content:"";position:absolute;right:98px;width:20px;height:20px;border-radius:50%;background:var(--floor)}
.ticket:before{top:-10px}.ticket:after{bottom:-10px}
.main{padding:16px 14px 14px 18px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px;font:600 16px/1 var(--disp);color:var(--ink2);letter-spacing:.02em}
.head b{color:var(--ink);font-size:20px}
.leg{padding:9px 0;border-top:1px dashed #b9c2bb}
.leg:first-of-type{border-top:0}
.who{display:flex;justify-content:space-between;gap:2px 10px;align-items:baseline;flex-wrap:wrap}
.who strong{font-weight:600;font-size:17px}
.pick{font:600 19px/1.1 var(--disp);white-space:nowrap}
.pick .over{color:#0f8a5f}.pick .under{color:#c2410c}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;color:var(--ink2);margin-top:2px}
.why{font-size:13px;color:var(--ink2);margin-top:2px}
.stub{border-left:2px dashed #b9c2bb;background:var(--paper2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px 6px}
.ring{--p:0;--c:var(--ball);width:84px;height:84px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--c) calc(var(--p)*1%),#cfd6cf 0)}
.ring span{width:66px;height:66px;border-radius:50%;background:var(--paper2);display:flex;align-items:center;justify-content:center;gap:1px;font:700 28px/1 var(--disp);color:var(--ink)}
.ring small{font:600 14px/1 var(--disp);margin-top:5px}
.stub .cap{font-size:12px;color:var(--ink2);text-align:center;line-height:1.25}
.stub .pay{font:600 15px/1 var(--disp);color:var(--ink)}
@media(max-width:380px){.ticket{grid-template-columns:1fr 96px}.ticket:before,.ticket:after{right:82px}.ring{width:72px;height:72px}.ring span{width:56px;height:56px;font-size:22px}}

/* tables */
.panel{background:var(--floor2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.panel h3{margin:0 0 8px;font:600 20px/1.1 var(--disp)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--mute);font-weight:500;font-size:13px}
td:first-child,th:first-child{position:sticky;left:0;background:var(--floor2)}
.pos{color:var(--good);font-weight:600}.neg{color:var(--bad)}
.warn{color:var(--amber);white-space:normal;min-width:160px}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px;color:var(--mute);font-size:14px}
select,input[type=number]{background:var(--floor);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
input[type=number]{width:70px}
.rk{display:inline-block;min-width:26px;text-align:center;border-radius:6px;padding:1px 6px;font-weight:600;color:#06141b}
.empty{color:var(--mute);padding:24px 4px}
.note{border-left:3px solid var(--amber);padding:2px 0 2px 12px;color:var(--mute);font-size:14px;margin:0 0 20px;max-width:70ch}

/* ---- v3 polish ---- */
body{background:
  radial-gradient(900px 480px at 85% -120px,rgba(255,122,61,.20),transparent 70%),
  radial-gradient(700px 400px at 0% 0%,rgba(74,163,255,.10),transparent 70%),
  var(--floor);position:relative;min-height:100vh}
body:before{content:"";position:absolute;inset:0 0 auto 0;height:760px;pointer-events:none;opacity:.9;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 760' fill='none' stroke='%23ffffff' stroke-opacity='.055' stroke-width='3'><rect x='40' y='-40' width='920' height='780'/><rect x='360' y='-40' width='280' height='380'/><circle cx='500' cy='340' r='140'/><path d='M130 -40 V150 A400 400 0 0 0 870 150 V-40'/><circle cx='500' cy='20' r='40'/></svg>") center top/cover no-repeat;
  -webkit-mask-image:linear-gradient(#000 40%,transparent);mask-image:linear-gradient(#000 40%,transparent)}
.wrap{position:relative}
.brand{font-size:36px;display:flex;align-items:center;gap:10px}
.brand:before{content:"";width:22px;height:22px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ffa06b,var(--ball) 60%,#c4511b);box-shadow:0 0 18px rgba(255,122,61,.55)}
.hero{background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.10);
  border-radius:20px;padding:22px 20px 16px;backdrop-filter:blur(6px);box-shadow:0 18px 50px rgba(0,0,0,.35)}
.hero-num b{font-size:96px;text-shadow:0 0 38px rgba(255,122,61,.55)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);font-size:13px;color:var(--txt)}
.chip b{font:700 16px/1 var(--disp)}
.sec{font:700 24px/1 var(--disp);margin:30px 0 12px;display:flex;align-items:center;gap:10px}
.sec:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.ticket{box-shadow:0 14px 34px rgba(0,0,0,.40);transition:transform .15s}
.ticket:hover{transform:translateY(-2px)}
.ticket .band{position:absolute;left:0;right:0;top:0;height:5px;background:var(--c)}
.avatar{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 15px/1 var(--disp);color:#fff;letter-spacing:.02em;
  background:var(--mc);box-shadow:inset 0 -3px 6px rgba(0,0,0,.22)}
.legrow{display:flex;gap:11px;align-items:center}
.legbody{flex:1;min-width:0}
.mk{display:inline-block;padding:2px 8px;border-radius:6px;font:700 13px/1.3 var(--disp);letter-spacing:.04em;color:#fff;background:var(--mc);vertical-align:1px}
.dir{font-size:12px;margin-right:2px}
.edgebar{height:5px;border-radius:3px;background:#d6dcd5;overflow:hidden;margin-top:6px;max-width:220px}
.edgebar i{display:block;height:100%;background:linear-gradient(90deg,#f2b84b,#27c28a);border-radius:3px}
.ring{width:92px;height:92px;box-shadow:0 0 0 5px rgba(0,0,0,.04)}
.ring span{width:72px;height:72px;font-size:32px}
@media(max-width:380px){.ring{width:76px;height:76px}.ring span{width:58px;height:58px;font-size:24px}}
.stub .cap{font-weight:500}
.stub .pay{background:var(--ink);color:#fff;border-radius:999px;padding:5px 10px;white-space:nowrap;font-size:14px}
/* best singles */
.singles{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x proximity;scrollbar-width:thin}
.single{flex:0 0 250px;scroll-snap-align:start;background:var(--floor2);border:1px solid var(--line);border-top:4px solid var(--mc);border-radius:14px;padding:12px 14px}
.single .n{font-weight:600}
.single .p{font:700 21px/1.1 var(--disp);white-space:nowrap;margin:2px 0 6px}
.single .m{color:var(--mute);font-size:13px;display:flex;justify-content:space-between}
.single .e{font:700 20px/1 var(--disp);color:var(--good)}
.tabs button{font-size:18px}
.tabs button[aria-selected=true]{color:#fff;text-shadow:0 0 14px rgba(255,122,61,.6)}
@media(prefers-reduced-motion:no-preference){.hero{animation:rise .5s ease-out both}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}}
</style></head>
<body><div class="wrap">
<div class="top"><h1 class="brand">Props Board</h1><div class="when" id="meta">Loading…</div></div>
<div class="tabs" id="tabs" role="tablist"></div>
<div id="view"></div>
</div>
<script>
const $=s=>document.querySelector(s);
let D=null,tab='slips',sortBy='value';
const MK={pts:'PTS',reb:'REB',ast:'AST',fg3m:'3PM',pra:'PRA',ra:'RA'};
const pct=x=>(x*100).toFixed(1)+'%', pc0=x=>Math.round(x*100);
const odds=o=>o>0?'+'+o:o;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MC={pts:'#e8631f',reb:'#2f86e0',ast:'#8b5cf6',fg3m:'#13a06f',pra:'#c8861a',ra:'#0fa3a3'};
const ini=n=>String(n).split(' ').filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const hue=p=>20+130*Math.min(1,Math.max(0,p));          // low chance = orange, high = green
const col=p=>`hsl(${hue(p)} 75% 45%)`;

fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{D=d;
  let up=d.updated;try{up=new Date(d.updated.replace(' UTC','Z').replace(' ','T')).toLocaleString([], {weekday:'short',hour:'2-digit',minute:'2-digit'})}catch(e){}
  $('#meta').textContent=`Games on ${d.game_day} · updated ${up} · ${d.n_eligible} of ${d.n_legs} props passed every check`;
  draw();
}).catch(()=>{$('#meta').textContent='No data yet. The first daily run has not finished.';draw()});

function tabs(){
  const t=[['slips','Slips'],['board','Board'],['teams','Teams'],['results','Results'],['info','Notes']];
  $('#tabs').innerHTML=t.map(([k,l])=>`<button role="tab" aria-selected="${k==tab}" data-t="${k}">${l}</button>`).join('');
  document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});
}
function draw(){tabs();if(!D){$('#view').innerHTML='';return}({slips,board,teams,results,info})[tab]()}

function slips(){
  const s=[...D.slips];
  if(!s.length){$('#view').innerHTML='<div class="empty">No slips today. Nothing passed every check.</div>';return}
  const exp=s.reduce((a,x)=>a+x.p_hit,0);
  const order=sortBy=='chance'?[...s].sort((a,b)=>b.p_hit-a.p_hit):sortBy=='legs'?[...s].sort((a,b)=>a.n-b.n||b.p_hit-a.p_hit):s;
  const idx=new Map(s.map((x,i)=>[x,i+1]));
  const placed=[];
  const ticks=[...s].sort((a,b)=>a.p_hit-b.p_hit).map(x=>{
    let r=0;while(placed.some(q=>q.r==r&&Math.abs(q.p-x.p_hit)<.045))r++;placed.push({r,p:x.p_hit});
    const h=26+r*20;                         // taller stem = higher row, so close numbers never overlap
    return `<div class="tick" style="left:${(x.p_hit*100).toFixed(1)}%;top:${58-h}px;height:${h}px"><span>${idx.get(x)}</span><i></i></div>`}).join('');
  $('#view').innerHTML=`
  <section class="hero" aria-label="Chance slips land">
    <div class="hero-num"><b>${exp.toFixed(1)}</b><span>of ${s.length} slips expected to land today</span></div>
    <div class="chips"><span class="chip"><b>${D.n_eligible}</b> props passed every check</span><span class="chip"><b>${(s.reduce((a,x)=>a+x.n,0)/s.length).toFixed(1)}</b> legs per slip on average</span><span class="chip">Best chance <b>${pc0(Math.max(...s.map(x=>x.p_hit)))}%</b></span></div>
    <div class="scale" role="img" aria-label="Each slip placed on a 0 to 100 percent scale of landing">
      <div class="rail"></div>${ticks}
      <div class="ends"><span>0%</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span></div>
    </div>
    <p class="fine">Each number on the scale is a slip, placed by the model's chance that every leg wins. Longer slips pay more but land less often. These are estimates, and in testing the model ran a little high in the 60–70% range.</p>
  </section>
  <div class="bar"><span class="lbl">Sort by</span>
    <div class="seg" role="group" aria-label="Sort slips">
      <button data-s="value" aria-pressed="${sortBy=='value'}">Best value</button>
      <button data-s="chance" aria-pressed="${sortBy=='chance'}">Most likely</button>
      <button data-s="legs" aria-pressed="${sortBy=='legs'}">Fewest legs</button>
    </div></div>
  <h2 class="sec">Today's slips</h2><div class="tickets">${order.map(x=>ticket(x,idx.get(x))).join('')}</div>${singles()}`;
  document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{sortBy=b.dataset.s;slips()});
}
function ticket(x,i){
  const legs=x.legs.map(l=>{const mc=MC[l.market]||'#556',up=l.side=='OVER';
    return `<div class="leg"><div class="legrow"><div class="avatar" style="--mc:${mc}">${esc(ini(l.player))}</div>
    <div class="legbody"><div class="who"><strong>${esc(l.player)}</strong>
    <span class="pick"><span class="${up?'over':'under'}"><span class="dir">${up?'\u25b2':'\u25bc'}</span>${up?'Over':'Under'}</span> ${l.line} <span class="mk" style="--mc:${mc}">${MK[l.market]||l.market}</span></span></div>
    <div class="meta"><span>${odds(l.odds)} at ${esc(l.book)}</span><span>model ${l.proj}</span><span>edge ${pct(l.edge)}</span></div>
    <div class="edgebar" title="Edge ${pct(l.edge)}"><i style="width:${Math.min(100,l.edge/0.15*100).toFixed(0)}%"></i></div>
    ${l.why?`<div class="why">${esc(l.why)}</div>`:''}</div></div></div>`}).join('');
  return `<article class="ticket" style="--c:${col(x.p_hit)}"><div class="band"></div><div class="main">
    <div class="head"><span>Slip ${i} \u00b7 ${x.n} ${x.n==1?'leg':'legs'}</span><b>pays ${x.pays}x</b></div>${legs}</div>
    <div class="stub"><div class="ring" style="--p:${pc0(x.p_hit)};--c:${col(x.p_hit)}"><span>${pc0(x.p_hit)}<small>%</small></span></div>
      <div class="cap">chance it lands</div><div class="pay">value ${x.ev>=0?'+':''}${(x.ev*100).toFixed(0)}%</div></div></article>`;
}
function singles(){
  const top=[...D.eligible].sort((a,b)=>b.edge-a.edge).slice(0,8);
  if(!top.length)return '';
  return `<h2 class="sec">Biggest single edges</h2><div class="singles">`+top.map(r=>`<div class="single" style="--mc:${MC[r.market]||'#556'}">
    <div class="n">${esc(r.player)}</div><div class="p">${r.side=='OVER'?'\u25b2 Over':'\u25bc Under'} ${r.line} ${MK[r.market]}</div>
    <div class="m"><span>${odds(r.odds)} at ${esc(r.book)}</span><span>chance ${pc0(r.p_model)}%</span></div>
    <div class="e">+${(r.edge*100).toFixed(1)}% edge</div></div>`).join('')+`</div>`;
}

function board(){
  const mk=['all',...Object.keys(MK)];
  $('#view').innerHTML=`<div class="panel"><div class="filters">
    <label>Market <select id="fm">${mk.map(m=>`<option value="${m}">${MK[m]||'All'}</option>`).join('')}</select></label>
    <label>Min edge % <input id="fe" type="number" value="3"></label>
    <label><input id="fo" type="checkbox" checked> Only props that passed every check</label></div>
    <div class="scroll"><table id="bt"></table></div></div>`;
  ['fm','fe','fo'].forEach(i=>$('#'+i).oninput=fill);fill();
}
function fill(){
  const m=$('#fm').value,e=+$('#fe').value/100,o=$('#fo').checked;
  const rows=(o?D.eligible:D.board).filter(r=>(m=='all'||r.market==m)&&r.edge>=e);
  $('#bt').innerHTML='<tr><th>Player</th><th>Market</th><th>Pick</th><th>Odds</th><th>Model</th><th>Chance</th><th>Book says</th><th>Edge</th><th>Value</th><th>Why</th><th>Notes</th></tr>'+
  (rows.map(r=>`<tr><td>${esc(r.player)}</td><td>${MK[r.market]}</td><td>${r.side=='OVER'?'Over':'Under'} ${r.line}</td><td>${odds(r.odds)} ${esc(r.book)}</td><td>${r.proj}</td><td>${pct(r.p_model)}</td><td>${pct(r.p_market)}</td><td class="pos">${pct(r.edge)}</td><td>${pct(r.ev)}</td><td>${esc(r.why||'')}</td><td class="warn">${esc([r.flag,r.corr].filter(Boolean).join(' · '))}</td></tr>`).join('')||'<tr><td>No rows</td></tr>');
}

function teams(){
  const k=['team','pace','pace#','ORtg','ORtg#','DRtg','DRtg#','PTSa','PTSa#','REBa','REBa#','ASTa','ASTa#','3PMa','3PMa#'];
  const rk=v=>`<span class="rk" style="background:hsl(${150-130*(v-1)/29} 60% 55%)">${v}</span>`;
  $('#view').innerHTML=`<div class="panel"><p class="fine" style="margin-bottom:10px">Teams playing today. A ranked cell shows 1 to 30: 1 is the best defense, best offense or fastest pace. "a" means allowed per game.</p>
  <div class="scroll"><table><tr>${k.map(c=>`<th>${c}</th>`).join('')}</tr>`+
  D.ranks.map(r=>`<tr>${k.map(c=>`<td>${c.endsWith('#')?rk(r[c]):r[c]}</td>`).join('')}</tr>`).join('')+'</table></div></div>';
}

function results(){
  const R=D.results;
  if(!R.graded){$('#view').innerHTML=`<div class="empty">No graded picks yet (${R.logged||0} logged). Results appear the morning after the games. Wait for a few hundred graded picks before judging the model.</div>`;return}
  const T=(t,a)=>`<div class="panel"><h3>${t}</h3><div class="scroll"><table><tr><th></th><th>Picks</th><th>Won</th><th>Model said</th><th>Units</th><th>Return</th></tr>`+(a||[]).map(r=>`<tr><td>${esc(r.group)}</td><td>${r.picks}</td><td>${pct(r.hit)}</td><td>${pct(r.avg_p)}</td><td class="${r.units>=0?'pos':'neg'}">${r.units.toFixed(1)}</td><td class="${r.roi>=0?'pos':'neg'}">${pct(r.roi)}</td></tr>`).join('')+'</table></div></div>';
  $('#view').innerHTML=`<p class="fine" style="margin-bottom:12px">${R.graded} graded, ${R.pending} waiting. One unit per pick.</p>`+T('All picks',R.all)+T('Passed every check (what goes on slips)',R.eligible)+T('By market',R.market)+T('By what drove the pick',R.lens)+T('By side',R.side);
}

function info(){
  $('#view').innerHTML=`<p class="note">Picks only. This never places bets. A big edge, above about 12%, often means the books know something the model does not, like a lineup change. Check the news before trusting it.</p>
