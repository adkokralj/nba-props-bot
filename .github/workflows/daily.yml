name: Daily NBA props run
on:
  schedule:
    - cron: "0 16 * * *"      # every day 16:00 UTC (17:00 Copenhagen), before US tip-offs
  workflow_dispatch: {}        # lets you press "Run workflow" by hand
permissions:
  contents: write
concurrency: daily-run
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LOGS_SOURCE: espn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install --no-deps nbainjuries
      - name: Grade yesterday's picks
        continue-on-error: true
        run: python track.py grade
      - name: Fetch tonight's lines
        env: { SPORTSGAMEODDS_KEY: "${{ secrets.SPORTSGAMEODDS_KEY }}" }
        run: python fetch_lines.py
      - name: Fetch injury report
        continue-on-error: true
        run: python fetch_injuries.py
      - name: Run the bot
        run: python run.py --lines lines.csv --export docs/data.json
      - name: Save results
        run: |
          git config user.name "props-bot"
          git config user.email "props-bot@users.noreply.github.com"
          git add -A docs
          for f in picks_log.csv slips_log.csv injuries.csv logs_cache.csv; do [ -f "$f" ] && git add "$f"; done
          git commit -m "Daily run $(date -u +%F)" || echo "nothing to commit"
          git push
